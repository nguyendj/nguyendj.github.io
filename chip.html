<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thế Giới Của Chip</title>
    <style>
        /* Cài đặt phông chữ và nền cho trang web */
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #fce4ec; /* Nền màu hồng nhạt đáng yêu */
            color: #333;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        /* Khung chứa nội dung chính */
        .container {
            max-width: 600px;
            margin: 50px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            border: 5px dashed #ff94c2; /* Viền nét đứt màu hồng */
        }

        /* Tiêu đề chính */
        h1 {
            color: #e91e63;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        /* Tùy chỉnh ảnh Avatar */
        .avatar {
            width: 200px;
            height: 200px;
            border-radius: 50%; /* Bo tròn ảnh */
            object-fit: cover;
            border: 6px solid #81c784; /* Viền xanh lá cây tươi tắn */
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            margin: 20px 0;
            /* Ảnh gốc đang bị xoay ngang, lệnh transform dưới đây sẽ dựng thẳng ảnh lên (nếu cần) */
            /* transform: rotate(90deg); */
        }

        /* Khu vực thông tin cá nhân */
        .info {
            background-color: #e1f5fe; /* Nền xanh dương nhạt */
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .info h2 {
            color: #0277bd;
        }

        .info p {
            font-size: 1.2em;
            line-height: 1.6;
        }

        /* Danh sách sở thích */
        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            font-size: 1.2em;
            background-color: #fff9c4; /* Nền vàng nhạt */
            margin: 10px 5px;
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            border: 2px solid #fbc02d;
            font-weight: bold;
            color: #f57f17;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Chào mừng đến với thế giới của Chip! 🌟</h1>
        
        <!-- Ảnh đại diện sử dụng tên file được cung cấp -->
        <img src="IMG_0439.jpg" alt="Avatar của bé Chip" class="avatar">
        
        <div class="info">
            <h2>Xin chào! Tớ là Chip 👋</h2>
            <p>Chào mừng các bạn đã ghé thăm ngôi nhà nhỏ của tớ trên Internet. Tớ rất thích những chuyến đi cắm trại vui vẻ!</p>
            
            <h3>Sở thích của tớ:</h3>
            <ul>
                <li>⛺ Đi cắm trại (Camping)</li>
                <li>😎 Đeo kính ngầu</li>
                <li>🎨 Vẽ tranh</li>
                <li>🍦 Ăn kem</li>
            </ul>
        </div>
    </div>

</body>
</html>
